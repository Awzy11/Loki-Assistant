name: Release

# Push a tag like v0.2.0 to build the downloads and publish a release and the Docker image.
# "Run workflow" on the Actions tab builds everything as downloadable artifacts without publishing anything (a dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, container: "rust:1-bookworm" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, container: "rust:1-bookworm" }
          - { name: macos-arm64, runner: macos-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --bin loki-server --bin loki-cli --bin loki-mcp --bin loki-bridge-mcp
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          D="loki-${VERSION}-${{ matrix.name }}"
          mkdir "$D"
          cp src-tauri/target/release/loki-server src-tauri/target/release/loki-cli src-tauri/target/release/loki-mcp src-tauri/target/release/loki-bridge-mcp "$D"/
          cp -r dist packs "$D"/
          cp LICENSE NOTICE README.md config.example.toml "$D"/
          printf '#!/bin/sh\ncd "$(dirname "$0")" || exit 1\nLOKI_STATIC_DIR=./dist exec ./loki-server\n' > "$D/loki.sh"
          chmod +x "$D/loki.sh"
          tar czf "$D.tar.gz" "$D"
          if command -v sha256sum >/dev/null; then sha256sum "$D.tar.gz" > "$D.tar.gz.sha256"; else shasum -a 256 "$D.tar.gz" > "$D.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: loki-${{ matrix.name }}
          path: loki-*.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: loki-*
          path: out
          merge-multiple: true
      - name: Combined checksums
        working-directory: out
        run: cat *.sha256 > SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $PRE
      - name: Unpack the Linux archives for the image
        run: |
          mkdir -p ctx/amd64 ctx/arm64
          tar xzf out/loki-*-linux-x86_64.tar.gz --strip-components=1 -C ctx/amd64
          tar xzf out/loki-*-linux-aarch64.tar.gz --strip-components=1 -C ctx/arm64
          cp Dockerfile.release ctx/Dockerfile
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - name: Image tags (a release candidate does not move "latest")
        id: tags
        run: |
          T="${{ steps.img.outputs.name }}:${{ github.ref_name }}"
          case "$GITHUB_REF_NAME" in *-*) ;; *) T="$T,${{ steps.img.outputs.name }}:latest" ;; esac
          echo "tags=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
