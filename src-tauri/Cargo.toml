[package]
name = "loki"
version = "0.2.1"
description = "Loki — a non-technical-user-friendly agent harness, local-first via Ollama"
authors = ["Awzy11"]
license = "Apache-2.0"
repository = "https://github.com/Awzy11/Loki-Assistant"
readme = "../README.md"
edition = "2021"
# `tauri build` can't infer the app binary once loki-server/loki-mcp add their own [[bin]]
# entries below — without this it fails with "failed to find main binary".
default-run = "loki"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
futures-util = "0.3"
toml = "0.8"
dirs = "5"
urlencoding = "2"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chacha20poly1305 = "0.10"
rand = "0.8"
argon2 = "0.5"
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
sqlite-vec = "0.1.9"
rmcp = { version = "3.1.4", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "macros"] }
schemars = "1.2.2"
regex = "1"

[[bin]]
name = "loki-server"
path = "src/bin/server.rs"

[[bin]]
name = "loki-mcp"
path = "src/bin/mcp_server.rs"


[[bin]]
name = "loki-bridge-mcp"
path = "src/bin/bridge_mcp.rs"

[[bin]]
name = "loki-device"
path = "src/bin/device.rs"

[[bin]]
name = "loki-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "loki-routine"
path = "src/bin/routine.rs"
