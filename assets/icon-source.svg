<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Loki app icon source: a stylised horned helm (original artwork, gold with green accents)
       on the app's own dark background (#14151a). Regenerate every size/format with:
         npx tauri icon assets/icon-source.svg   (then copy the PNGs to public/, see ops/make-icons.sh) -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc86"/>
      <stop offset="0.55" stop-color="#d9a73a"/>
      <stop offset="1" stop-color="#a97619"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9832a"/>
      <stop offset="0.5" stop-color="#f1cf6c"/>
      <stop offset="1" stop-color="#b9832a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1f3b2f"/>
      <stop offset="1" stop-color="#14151a"/>
    </radialGradient>
    <g id="horn">
      <path d="M214 258 C146 246 100 184 98 106 C97 78 92 56 80 30 C122 60 134 100 160 140 C182 172 208 188 234 196 Z" fill="url(#gold)"/>
      <path d="M80 30 C120 62 132 102 158 140" fill="none" stroke="#fff3c0" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- horns -->
  <use href="#horn"/>
  <use href="#horn" transform="translate(512 0) scale(-1 1)"/>
  <!-- helm dome + cheek guards -->
  <path d="M256 104 C196 106 160 156 162 232 L164 306 C164 346 190 382 224 404 L256 436 L288 404 C322 382 348 346 348 306 L350 232 C352 156 316 106 256 104 Z" fill="url(#goldSide)"/>
  <path d="M256 104 C196 106 160 156 162 232 L164 306 C164 346 190 382 224 404 L256 436 L288 404 C322 382 348 346 348 306 L350 232 C352 156 316 106 256 104 Z" fill="none" stroke="#7a5412" stroke-width="4" stroke-linejoin="round"/>
  <!-- face opening -->
  <path d="M208 242 C208 224 232 212 256 212 C280 212 304 224 304 242 L302 304 C298 340 278 366 256 380 C234 366 214 340 210 304 Z" fill="#14151a"/>
  <!-- nose guard -->
  <path d="M249 212 H263 L262 322 L256 340 L250 322 Z" fill="url(#gold)" stroke="#7a5412" stroke-width="2"/>
  <!-- brow band + crest -->
  <path d="M170 214 C200 190 232 184 256 184 C280 184 312 190 342 214 L330 236 C306 218 282 212 256 212 C230 212 206 218 182 236 Z" fill="#2fbf71" stroke="#0f6b3b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M256 84 L282 150 L256 196 L230 150 Z" fill="url(#gold)" stroke="#7a5412" stroke-width="3" stroke-linejoin="round"/>
  <path d="M256 104 L268 148 L256 172 L244 148 Z" fill="#2fbf71" stroke="#0f6b3b" stroke-width="2" stroke-linejoin="round"/>
  <!-- cheek rivets -->
  <circle cx="188" cy="292" r="5" fill="#fff3c0" fill-opacity="0.8"/>
  <circle cx="324" cy="292" r="5" fill="#fff3c0" fill-opacity="0.8"/>
</svg>
